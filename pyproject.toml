[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcstone-adaptive-producer-lab"
version = "0.1.0"
description = "Bounded adaptive-producer experiment upstream of the Arcstone Execution Boundary"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arcstone-adaptive-lab = "arcstone_adaptive_producer_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
