name: lab-ci
on: [push, pull_request]
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - run: pytest
      - run: arcstone-adaptive-lab run --config configs/run-001.json --dry-run
      - run: arcstone-adaptive-lab verify evidence/run-001/dev/attempts.jsonl
